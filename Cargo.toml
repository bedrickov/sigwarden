[package]
name = "sigwarden"
version = "1.0.0"
edition = "2021"
authors = ["SigWarden Contributors"]
description = "Cryptographic file integrity auditor, anti-ransomware canary tripwire & binary tamper detector"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"

[lib]
name = "sigwarden_core"
path = "src/lib.rs"

[[bin]]
name = "sigwarden"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
